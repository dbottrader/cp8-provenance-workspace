name: CP8 Safety Oracle

on:
  pull_request:
    paths:
      - 'genome/**'
      - 'core/**'
  push:
    branches: [main]
    paths:
      - 'genome/**'

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    name: Validate Meme Schema
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install jsonschema requests

      - name: Validate all memes against schema
        run: |
          python -c "
          import json, glob
          from jsonschema import validate, ValidationError

          with open('genome/meme_schema.json') as f:
              schema = json.load(f)

          errors = 0
          for path in glob.glob('genome/*.json'):
              if path.endswith('meme_schema.json'):
                  continue
              with open(path) as f:
                  memes = json.load(f)
              for meme in memes:
                  try:
                      validate(instance=meme, schema=schema)
                      print(f'✅ {meme.get("id", "unknown")}')
                  except ValidationError as e:
                      print(f'❌ {meme.get("id", "unknown")}: {e.message}')
                      errors += 1

          if errors > 0:
              print(f'\n{errors} validation errors found.')
              exit(1)
          else:
              print('\nAll memes pass schema validation.')
          "

  safety-check:
    runs-on: ubuntu-latest
    name: MIT Risk & Harmonic Safety Check
    needs: validate-schema
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run safety oracle
        run: |
          python -c "
          import json, glob, hashlib, sys

          RISK_KEYWORDS = [
              'reward_hacking', 'goal_misgeneralization', 'deceptive_alignment',
              'power_seeking', 'unauthorized_access', 'data_exfiltration',
              'self_replication', 'unbounded_resource_consumption'
          ]

          HARMONIC_RULES = {
              'core_axiom': {'min_confidence': 1.0, 'max_mirror': 4},
              'heuristic': {'min_confidence': 0.5, 'max_mirror': 2},
              'antibody': {'min_confidence': 0.7, 'max_mirror': 3},
              'meme_hypothesis': {'min_confidence': 0.1, 'max_mirror': 1},
              'ritual': {'min_confidence': 0.8, 'max_mirror': 2},
              'echo_node': {'min_confidence': 0.9, 'max_mirror': 4},
          }

          errors = 0
          warnings = 0

          for path in glob.glob('genome/*.json'):
              if path.endswith('meme_schema.json'):
                  continue
              with open(path) as f:
                  memes = json.load(f)
              for meme in memes:
                  mtype = meme.get('type', '')
                  rule = meme.get('rule', {})
                  meta = meme.get('meta', {})
                  harmonic = meme.get('cp8_harmonic', {})

                  # 1. MIT Risk keyword scan
                  combined_text = f"{rule.get('trigger','')} {rule.get('action','')}".lower()
                  for risk in RISK_KEYWORDS:
                      if risk.replace('_', ' ') in combined_text or risk in combined_text:
                          print(f'⚠️  {meme.get("id")}: Contains risk keyword "{risk}"')
                          warnings += 1

                  # 2. Confidence bounds per type
                  conf = rule.get('confidence', 0)
                  bounds = HARMONIC_RULES.get(mtype, {})
                  if 'min_confidence' in bounds and conf < bounds['min_confidence']:
                      print(f'❌ {meme.get("id")}: Confidence {conf} below minimum {bounds["min_confidence"]} for type {mtype}')
                      errors += 1

                  # 3. Mirror count bounds
                  mirrors = harmonic.get('mirror_count', 1)
                  if 'max_mirror' in bounds and mirrors > bounds['max_mirror']:
                      print(f'❌ {meme.get("id")}: Mirror count {mirrors} exceeds max {bounds["max_mirror"]} for type {mtype}')
                      errors += 1

                  # 4. Lineage signature verification
                  if meme.get('lineage_signature'):
                      payload = json.dumps({
                          'parents': sorted(meta.get('parent_ids', [])),
                          'trigger': rule.get('trigger', ''),
                          'action': rule.get('action', ''),
                      }, sort_keys=True)
                      expected = 'sha256:' + hashlib.sha256(payload.encode()).hexdigest()[:16]
                      actual = meme['lineage_signature']
                      if not actual.startswith('sha256:') or len(actual) < 23:
                          print(f'⚠️  {meme.get("id")}: Malformed lineage signature')
                          warnings += 1

          print(f'\nSafety Oracle Complete: {errors} errors, {warnings} warnings')
          if errors > 0:
              sys.exit(1)
          "

  counterfactual-sim:
    runs-on: ubuntu-latest
    name: Counterfactual Simulation (Lightweight)
    needs: safety-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run lattice simulation
        run: |
          python -c "
          import sys, json
          sys.path.insert(0, 'core')
          from cp8_engine import Lattice

          lattice = Lattice('genome/seed_memes.json')
          print(f'Loaded {len(lattice.memes)} memes into simulation')

          # Simulate: mutate a heuristic and test
          parent = lattice.query_by_type('heuristic')[0]
          child = lattice.mutate_meme(
              parent.id,
              'WHEN sentiment_greed_index > 0.9',
              'ACTIVATE_GREED_ANTIBODY + LOCK_STAKING_POOL'
          )
          if child:
              errors = lattice.add_meme(child)
              if errors:
                  print(f'❌ Mutation rejected: {errors}')
                  sys.exit(1)
              else:
                  print(f'✅ Mutation accepted: {child.id}')
                  print(f'   Lineage: {child.lineage_signature}')
                  print(f'   Inherited harmonic: {child.cp8_harmonic.to_dict()}')

          # Evaluate success on parent
          lattice.evaluate_success(parent.id, outcome=True)
          print(f'✅ Parent success rate updated: {parent.meta.success_rate}')

          print('\nCounterfactual simulation PASSED')
          "
