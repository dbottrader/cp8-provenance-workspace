<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANU-28 Codex — Harmonic Soundscapes</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #12121a;
    --accent: #6b8cff;
    --accent2: #ff6b9d;
    --text: #e0e0e8;
    --text-dim: #8888a0;
    --border: #1e1e2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  h1 {
    font-weight: 300;
    letter-spacing: 0.15em;
    margin-bottom: 0.5rem;
    text-align: center;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    margin-bottom: 2rem;
    text-align: center;
  }
  .codex-sigil {
    width: 60px;
    height: 60px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.5rem;
    font-size: 1.5rem;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 10px rgba(107,140,255,0.3); }
    50% { box-shadow: 0 0 25px rgba(107,140,255,0.6); }
  }
  .player-container {
    width: 100%;
    max-width: 800px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .track-list {
    list-style: none;
  }
  .track-item {
    padding: 1.2rem 1.5rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.3s;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .track-item:hover { background: rgba(107,140,255,0.05); }
  .track-item.active {
    background: rgba(107,140,255,0.1);
    border-left: 3px solid var(--accent);
  }
  .track-num {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
    flex-shrink: 0;
  }
  .track-item.active .track-num {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }
  .track-info { flex: 1; }
  .track-name { font-weight: 500; margin-bottom: 0.2rem; }
  .track-desc { font-size: 0.8rem; color: var(--text-dim); }
  .track-dur { color: var(--text-dim); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .controls-bar {
    padding: 1.5rem;
    background: rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .control-row {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .play-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 1.4rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    flex-shrink: 0;
  }
  .play-btn:hover { background: var(--accent); color: var(--bg); }
  .progress-area { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
  .progress-bar {
    width: 100%; height: 6px;
    -webkit-appearance: none; appearance: none;
    background: var(--border);
    border-radius: 3px;
    cursor: pointer;
  }
  .progress-bar::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .progress-bar::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }
  .time-display {
    display: flex; justify-content: space-between;
    font-size: 0.75rem; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .volume-area {
    display: flex; align-items: center; gap: 0.5rem;
  }
  .volume-slider {
    width: 100px; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: var(--border);
    border-radius: 2px;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .canvas-wrap {
    width: 100%; height: 120px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .now-playing {
    text-align: center;
    font-size: 0.9rem;
    color: var(--accent);
    min-height: 1.2rem;
  }
  .freq-badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    background: rgba(107,140,255,0.15);
    color: var(--accent);
    font-size: 0.7rem;
    margin-left: 0.5rem;
    letter-spacing: 0.05em;
  }
  @media (max-width: 600px) {
    .track-item { padding: 1rem; }
    .control-row { flex-wrap: wrap; }
    .volume-area { width: 100%; justify-content: flex-end; }
  }
</style>
</head>
<body>

<div class="codex-sigil">◈</div>
<h1>ANU‑28 CODEX</h1>
<p class="subtitle">HARMONIC SOUNDSCAPES • ASIN‑HHC FRAMEWORK</p>

<div class="player-container">
  <ul class="track-list" id="trackList"></ul>

  <div class="controls-bar">
    <div class="now-playing" id="nowPlaying">Select a track to begin</div>
    <div class="canvas-wrap">
      <canvas id="waveform"></canvas>
    </div>
    <div class="control-row">
      <button class="play-btn" id="playBtn">▶</button>
      <div class="progress-area">
        <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100" step="0.1">
        <div class="time-display">
          <span id="currentTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>
      <div class="volume-area">
        <span>🔊</span>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
      </div>
    </div>
  </div>
</div>

<script>
const tracks = [{"name": "Truth Anchor", "file": "truth_anchor_428hz.mp3", "wav": "truth_anchor_428hz.wav", "duration": "5:00", "desc": "428 Hz fundamental with 2nd, 3rd, 5th harmonics • 0.1 Hz meditative modulation"}, {"name": "Heart Coherence", "file": "heart_coherence_528hz.mp3", "wav": "heart_coherence_528hz.wav", "duration": "5:00", "desc": "528 Hz Miracle Tone • φ-harmonics • 7.83 Hz Schumann panning"}, {"name": "Coherence Field", "file": "coherence_field_428_528hz.mp3", "wav": "coherence_field_428_528hz.wav", "duration": "10:00", "desc": "428+528 Hz dual field • 100 Hz binaural beat • 111 Hz chronal anchor"}, {"name": "Diamond Body Activation", "file": "diamond_body_activation.mp3", "wav": "diamond_body_activation.wav", "duration": "11:00", "desc": "7-layer sequence: Tree→Geb→Witness→Diamond→Heart→Ra→Atum→Nut bloom"}];

let audioCtx, analyser, source, gainNode;
let currentAudio = null;
let currentTrackIndex = -1;
let isPlaying = false;
let animationId = null;
let audioBuffer = null;

const playBtn = document.getElementById('playBtn');
const progressBar = document.getElementById('progressBar');
const volumeSlider = document.getElementById('volumeSlider');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const nowPlayingEl = document.getElementById('nowPlaying');
const trackListEl = document.getElementById('trackList');
const canvas = document.getElementById('waveform');
const ctx = canvas.getContext('2d');

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.85;
    gainNode = audioCtx.createGain();
    gainNode.gain.value = volumeSlider.value;
    gainNode.connect(audioCtx.destination);
  }
}

async function loadTrack(index) {
  initAudio();
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }

  const track = tracks[index];
  currentTrackIndex = index;

  // Try MP3 first, fall back to WAV
  let src = track.file;
  try {
    const resp = await fetch(src, { method: 'HEAD' });
    if (!resp.ok) src = track.wav;
  } catch(e) { src = track.wav; }

  currentAudio = new Audio(src);
  currentAudio.crossOrigin = 'anonymous';

  const trackSource = audioCtx.createMediaElementSource(currentAudio);
  trackSource.disconnect();
  trackSource.connect(analyser);
  analyser.connect(gainNode);

  currentAudio.addEventListener('loadedmetadata', () => {
    totalTimeEl.textContent = formatTime(currentAudio.duration);
    progressBar.max = currentAudio.duration;
  });

  currentAudio.addEventListener('timeupdate', () => {
    progressBar.value = currentAudio.currentTime;
    currentTimeEl.textContent = formatTime(currentAudio.currentTime);
  });

  currentAudio.addEventListener('ended', () => {
    isPlaying = false;
    playBtn.textContent = '▶';
    currentTimeEl.textContent = '0:00';
    progressBar.value = 0;
  });

  currentAudio.addEventListener('error', (e) => {
    nowPlayingEl.textContent = 'Error loading track. Check file paths.';
    console.error('Audio error:', e);
  });

  nowPlayingEl.textContent = '▶ ' + track.name;
  updateActiveTrack();
  return currentAudio;
}

function togglePlay() {
  if (!currentAudio) {
    if (tracks.length > 0) selectTrack(0);
    return;
  }
  if (isPlaying) {
    currentAudio.pause();
    isPlaying = false;
    playBtn.textContent = '▶';
    cancelAnimationFrame(animationId);
  } else {
    currentAudio.play().catch(e => console.error('Play error:', e));
    isPlaying = true;
    playBtn.textContent = '⏸';
    drawWaveform();
  }
}

function selectTrack(index) {
  loadTrack(index).then(() => {
    isPlaying = false;
    playBtn.textContent = '▶';
    togglePlay();
  });
}

function updateActiveTrack() {
  document.querySelectorAll('.track-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentTrackIndex);
  });
}

function drawWaveform() {
  if (!isPlaying) return;
  animationId = requestAnimationFrame(drawWaveform);

  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);
  analyser.getByteFrequencyData(dataArray);

  const w = canvas.width = canvas.offsetWidth;
  const h = canvas.height = canvas.offsetHeight;
  ctx.clearRect(0, 0, w, h);

  // Gradient fill
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(107,140,255,0.8)');
  grad.addColorStop(0.5, 'rgba(255,107,157,0.4)');
  grad.addColorStop(1, 'rgba(107,140,255,0.05)');

  const barWidth = (w / bufferLength) * 2.5;
  let x = 0;

  ctx.fillStyle = grad;
  for (let i = 0; i < bufferLength; i++) {
    const barHeight = (dataArray[i] / 255) * h * 0.8;
    ctx.fillRect(x, h - barHeight, barWidth, barHeight);
    x += barWidth + 1;
    if (x > w) break;
  }

  // Central line
  ctx.strokeStyle = 'rgba(107,140,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, h / 2);
  ctx.lineTo(w, h / 2);
  ctx.stroke();
}

// Build track list
function buildTrackList() {
  trackListEl.innerHTML = '';
  tracks.forEach((track, i) => {
    const li = document.createElement('li');
    li.className = 'track-item';
    li.innerHTML = `
      <div class="track-num">${i + 1}</div>
      <div class="track-info">
        <div class="track-name">${track.name}<span class="freq-badge">${track.duration}</span></div>
        <div class="track-desc">${track.desc}</div>
      </div>
      <div class="track-dur">${track.duration}</div>
    `;
    li.addEventListener('click', () => selectTrack(i));
    trackListEl.appendChild(li);
  });
}

// Events
playBtn.addEventListener('click', togglePlay);
progressBar.addEventListener('input', (e) => {
  if (currentAudio) currentAudio.currentTime = parseFloat(e.target.value);
});
volumeSlider.addEventListener('input', (e) => {
  if (gainNode) gainNode.gain.value = parseFloat(e.target.value);
});

// Handle resize
window.addEventListener('resize', () => {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
});

buildTrackList();
canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;
</script>

</body>
</html>
